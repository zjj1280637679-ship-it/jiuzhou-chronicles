<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <!-- 专属阵营背景渐变 -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#14301e" />
      <stop offset="65%" stop-color="#081a10" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- 电影感金色光斑渐变 -->
    <radialGradient id="sunGlow" cx="50%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#22c55e" stop-opacity="0.12" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </radialGradient>

    <!-- 主题流光渐变 -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="50%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- 投影与光晕滤镜 -->
    <filter id="epicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- 1. 画卷黑金底色 -->
  <rect width="960" height="540" fill="url(#bgGrad)" />

  <!-- 2. 电影环境光晕层 -->
  <circle cx="480" cy="200" r="380" fill="url(#sunGlow)" />

  <!-- 3. 背景剪影装饰 (根据阵营变化建筑/山水/海潮) -->
  <g fill="#0a180f" opacity="0.75">
        <path d="M 0 360 Q 200 310 440 350 T 960 330 L 960 540 L 0 540 Z" />
        <!-- 毡帐圆形穹顶 -->
        <path d="M 380 350 Q 480 240 580 350 Z" fill="#06120b" />
        <path d="M 475 220 L 485 220 L 485 270 L 475 270 Z" fill="#f59e0b" />
        <circle cx="480" cy="216" r="6" fill="#f59e0b" />
        <!-- 远景飞鹰 -->
        <path d="M 220 150 Q 240 140 260 152 Q 275 142 290 150 Q 260 162 220 150 Z" fill="#22c55e" opacity="0.4" />
      </g>

  <!-- 4. 核心主题视觉剪影构图 -->
  <g transform="translate(480, 275)" filter="url(#softShadow)">
        <!-- 珍宝箱 -->
        <rect x="-70" y="0" width="140" height="70" rx="6" fill="#2d1d0f" stroke="#f59e0b" stroke-width="3" />
        <path d="M -70 24 L 70 24" stroke="#f59e0b" stroke-width="2" />
        <!-- 宝箱铜锁 -->
        <circle cx="0" cy="24" r="9" fill="#f59e0b" />
        <circle cx="0" cy="24" r="4" fill="#000" />

        <!-- 箱中满溢金锭与珍珠 -->
        <g fill="#f59e0b" filter="url(#epicGlow)">
          <ellipse cx="-30" cy="-5" rx="16" ry="9" />
          <ellipse cx="0" cy="-12" rx="18" ry="10" />
          <ellipse cx="30" cy="-5" rx="16" ry="9" />
          <ellipse cx="-15" cy="-22" rx="14" ry="8" fill="#fff" />
          <ellipse cx="15" cy="-22" rx="14" ry="8" />
        </g>
        <!-- 宝光四射闪星 -->
        <polygon points="-40,-35 -37,-25 -27,-22 -37,-19 -40,-9 -43,-19 -53,-22 -43,-25" fill="#fff" />
        <polygon points="45,-45 48,-35 58,-32 48,-29 45,-19 42,-29 32,-32 42,-35" fill="#f59e0b" />
      </g>

  <!-- 5. 边框典雅暗金纹饰 -->
  <rect x="20" y="20" width="920" height="500" rx="12" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.4" />
  <rect x="26" y="26" width="908" height="488" rx="8" fill="none" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.25" stroke-dasharray="6,4" />

  <!-- 四角祥云/回纹雕花 -->
  <g stroke="#f59e0b" stroke-width="1.5" fill="none" opacity="0.75">
    <path d="M 30 50 L 30 30 L 50 30 M 35 35 L 45 35 M 35 45 L 35 35" />
    <path d="M 930 50 L 930 30 L 910 30 M 925 35 L 915 35 M 925 45 L 925 35" />
    <path d="M 30 490 L 30 510 L 50 510 M 35 505 L 45 505 M 35 495 L 35 505" />
    <path d="M 930 490 L 930 510 L 910 510 M 925 505 L 915 505 M 925 495 L 925 505" />
  </g>

  <!-- 6. 阵营标识与主题徽章 (顶部悬浮) -->
  <g transform="translate(480, 56)" text-anchor="middle">
    <rect x="-140" y="-18" width="280" height="34" rx="17" fill="rgba(8, 14, 22, 0.85)" stroke="#22c55e" stroke-width="1" />
    <text y="5" font-family="'Noto Serif SC', 'Songti SC', serif" font-size="14" fill="#f59e0b" font-weight="700" letter-spacing="3">
      大漠蒙古 · 财富画卷
    </text>
  </g>

  <!-- 7. 画面底部剧场文学说明标牌 (黑金半透遮罩) -->
  <g transform="translate(48, 420)">
    <rect width="864" height="84" rx="8" fill="rgba(6, 10, 16, 0.85)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" filter="url(#softShadow)" />
    <!-- 标牌左侧主题图标 -->
    <text x="32" y="52" font-size="32" filter="url(#epicGlow)">💰</text>
    <!-- 标题 -->
    <text x="80" y="34" font-family="'Noto Serif SC', serif" font-size="18" font-weight="900" fill="#f59e0b" letter-spacing="1">
      【财富】万顷牛羊 · 驼道金珠
    </text>
    <!-- 意境散文白描 -->
    <text x="80" y="60" font-family="'Noto Serif SC', serif" font-size="12" fill="#cbd5e1" opacity="0.9" letter-spacing="0.5">
      水草丰美牛羊塞道，万峰驼队自茶马古道满载茶砖、苏木与西域玛瑙黄金归来，黄金家族富甲瀚海。
    </text>
  </g>
</svg>