<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <!-- 专属阵营背景渐变 -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#331612" />
      <stop offset="65%" stop-color="#1a0f0d" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- 电影感金色光斑渐变 -->
    <radialGradient id="sunGlow" cx="50%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#e5b95c" stop-opacity="0.12" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </radialGradient>

    <!-- 主题流光渐变 -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5b95c" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- 投影与光晕滤镜 -->
    <filter id="epicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- 1. 画卷黑金底色 -->
  <rect width="960" height="540" fill="url(#bgGrad)" />

  <!-- 2. 电影环境光晕层 -->
  <circle cx="480" cy="200" r="380" fill="url(#sunGlow)" />

  <!-- 3. 背景剪影装饰 (根据阵营变化建筑/山水/海潮) -->
  <g fill="#1a0c0a" opacity="0.8">
        <path d="M 0 360 L 180 320 L 320 350 L 540 300 L 760 340 L 960 320 L 960 540 L 0 540 Z" />
        <!-- 殿宇庑殿顶 -->
        <path d="M 280 330 L 320 240 L 480 210 L 640 240 L 680 330 Z" fill="#140807" />
        <path d="M 240 250 L 480 200 L 720 250 L 690 262 L 480 215 L 270 262 Z" fill="#240f0c" />
        <!-- 角楼攒尖顶 -->
        <path d="M 120 340 L 150 260 L 180 340 Z M 780 340 L 810 260 L 840 340 Z" fill="#1c0b09" />
      </g>

  <!-- 4. 核心主题视觉剪影构图 -->
  <g transform="translate(480, 265)" filter="url(#softShadow)">
        <!-- 漫天柔和烛光/星辰微粒 -->
        <circle cx="-50" cy="-60" r="2.5" fill="#ef4444" opacity="0.8" />
        <circle cx="60" cy="-70" r="3" fill="#fff" opacity="0.9" />
        <circle cx="0" cy="-90" r="2" fill="#ef4444" opacity="0.7" />

        <!-- 两人相依身影 (同袍深情) -->
        <path d="M -50 70 L -30 0 L 0 10 L -15 70 Z" fill="#e5b95c" opacity="0.9" />
        <circle cx="-25" cy="-18" r="16" fill="#ef4444" />

        <path d="M 50 70 L 30 0 L 0 10 L 15 70 Z" fill="#b45309" opacity="0.9" />
        <circle cx="25" cy="-18" r="16" fill="#e5b95c" />

        <!-- 两人执手相挽核心光晕 -->
        <circle cx="0" cy="18" r="12" fill="#ef4444" opacity="0.85" filter="url(#epicGlow)" />
        <path d="M -5 18 Q 0 10 5 18 Q 0 26 -5 18 Z" fill="#fff" />
      </g>

  <!-- 5. 边框典雅暗金纹饰 -->
  <rect x="20" y="20" width="920" height="500" rx="12" fill="none" stroke="#e5b95c" stroke-width="1.5" stroke-opacity="0.4" />
  <rect x="26" y="26" width="908" height="488" rx="8" fill="none" stroke="#ef4444" stroke-width="0.8" stroke-opacity="0.25" stroke-dasharray="6,4" />

  <!-- 四角祥云/回纹雕花 -->
  <g stroke="#ef4444" stroke-width="1.5" fill="none" opacity="0.75">
    <path d="M 30 50 L 30 30 L 50 30 M 35 35 L 45 35 M 35 45 L 35 35" />
    <path d="M 930 50 L 930 30 L 910 30 M 925 35 L 915 35 M 925 45 L 925 35" />
    <path d="M 30 490 L 30 510 L 50 510 M 35 505 L 45 505 M 35 495 L 35 505" />
    <path d="M 930 490 L 930 510 L 910 510 M 925 505 L 915 505 M 925 495 L 925 505" />
  </g>

  <!-- 6. 阵营标识与主题徽章 (顶部悬浮) -->
  <g transform="translate(480, 56)" text-anchor="middle">
    <rect x="-140" y="-18" width="280" height="34" rx="17" fill="rgba(8, 14, 22, 0.85)" stroke="#e5b95c" stroke-width="1" />
    <text y="5" font-family="'Noto Serif SC', 'Songti SC', serif" font-size="14" fill="#ef4444" font-weight="700" letter-spacing="3">
      大明中枢 · 爱情画卷
    </text>
  </g>

  <!-- 7. 画面底部剧场文学说明标牌 (黑金半透遮罩) -->
  <g transform="translate(48, 420)">
    <rect width="864" height="84" rx="8" fill="rgba(6, 10, 16, 0.85)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" filter="url(#softShadow)" />
    <!-- 标牌左侧主题图标 -->
    <text x="32" y="52" font-size="32" filter="url(#epicGlow)">❤️</text>
    <!-- 标题 -->
    <text x="80" y="34" font-family="'Noto Serif SC', serif" font-size="18" font-weight="900" fill="#ef4444" letter-spacing="1">
      【风月/羁绊】深宫密约 · 孤忠相许
    </text>
    <!-- 意境散文白描 -->
    <text x="80" y="60" font-family="'Noto Serif SC', serif" font-size="12" fill="#cbd5e1" opacity="0.9" letter-spacing="0.5">
      文渊阁摇红残烛之下，内阁重臣与执剑缇骑并肩而立，执手相看。天下板荡生死与共，断袖同心胜似海誓山盟。
    </text>
  </g>
</svg>