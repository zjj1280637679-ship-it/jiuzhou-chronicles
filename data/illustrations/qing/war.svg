<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <!-- 专属阵营背景渐变 -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#16283d" />
      <stop offset="65%" stop-color="#08121e" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- 电影感金色光斑渐变 -->
    <radialGradient id="sunGlow" cx="50%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="transparent" stop-opacity="0" />
    </radialGradient>

    <!-- 主题流光渐变 -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- 投影与光晕滤镜 -->
    <filter id="epicGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- 1. 画卷黑金底色 -->
  <rect width="960" height="540" fill="url(#bgGrad)" />

  <!-- 2. 电影环境光晕层 -->
  <circle cx="480" cy="200" r="380" fill="url(#sunGlow)" />

  <!-- 3. 背景剪影装饰 (根据阵营变化建筑/山水/海潮) -->
  <g fill="#0c1824" opacity="0.75">
        <path d="M 0 380 Q 240 320 480 340 T 960 330 L 960 540 L 0 540 Z" />
        <path d="M 120 330 L 140 280 L 160 330 Z M 200 340 L 220 270 L 240 340 Z M 780 320 L 800 260 L 820 320 Z" fill="#081018" />
        <!-- 满洲大殿斗拱剪影 -->
        <path d="M 360 340 L 380 260 L 480 230 L 580 260 L 600 340 Z" fill="#0a1420" />
        <path d="M 330 265 L 480 220 L 630 265 L 610 275 L 480 235 L 350 275 Z" fill="#0f1f30" />
      </g>

  <!-- 4. 核心主题视觉剪影构图 -->
  <g transform="translate(480, 280)" filter="url(#softShadow)">
        <!-- 滚滚狼烟 -->
        <path d="M -180 50 Q -150 -50 -100 -120 Q -60 -180 0 -220 Q 60 -170 120 -110 Q 180 -40 200 50 Z" fill="#0284c7" opacity="0.25" />
        <!-- 军旗招展 -->
        <line x1="-60" y1="60" x2="-60" y2="-90" stroke="#fbbf24" stroke-width="4" />
        <polygon points="-60,-90 20,-60 -60,-30" fill="#38bdf8" opacity="0.9" />
        <text x="-40" y="-55" font-size="18" font-weight="900" fill="#000">后</text>

        <!-- 密密麻麻长矛阵列 -->
        <g stroke="#38bdf8" stroke-width="2.5" opacity="0.85">
          <line x1="-160" y1="50" x2="-110" y2="-50" />
          <line x1="-130" y1="50" x2="-80" y2="-60" />
          <line x1="-90" y1="50" x2="-40" y2="-70" />
          <line x1="60" y1="50" x2="110" y2="-55" />
          <line x1="100" y1="50" x2="140" y2="-65" />
          <line x1="130" y1="50" x2="170" y2="-45" />
        </g>
      </g>

  <!-- 5. 边框典雅暗金纹饰 -->
  <rect x="20" y="20" width="920" height="500" rx="12" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" />
  <rect x="26" y="26" width="908" height="488" rx="8" fill="none" stroke="#fbbf24" stroke-width="0.8" stroke-opacity="0.25" stroke-dasharray="6,4" />

  <!-- 四角祥云/回纹雕花 -->
  <g stroke="#fbbf24" stroke-width="1.5" fill="none" opacity="0.75">
    <path d="M 30 50 L 30 30 L 50 30 M 35 35 L 45 35 M 35 45 L 35 35" />
    <path d="M 930 50 L 930 30 L 910 30 M 925 35 L 915 35 M 925 45 L 925 35" />
    <path d="M 30 490 L 30 510 L 50 510 M 35 505 L 45 505 M 35 495 L 35 505" />
    <path d="M 930 490 L 930 510 L 910 510 M 925 505 L 915 505 M 925 495 L 925 505" />
  </g>

  <!-- 6. 阵营标识与主题徽章 (顶部悬浮) -->
  <g transform="translate(480, 56)" text-anchor="middle">
    <rect x="-140" y="-18" width="280" height="34" rx="17" fill="rgba(8, 14, 22, 0.85)" stroke="#38bdf8" stroke-width="1" />
    <text y="5" font-family="'Noto Serif SC', 'Songti SC', serif" font-size="14" fill="#fbbf24" font-weight="700" letter-spacing="3">
      后金八旗 · 战争画卷
    </text>
  </g>

  <!-- 7. 画面底部剧场文学说明标牌 (黑金半透遮罩) -->
  <g transform="translate(48, 420)">
    <rect width="864" height="84" rx="8" fill="rgba(6, 10, 16, 0.85)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" filter="url(#softShadow)" />
    <!-- 标牌左侧主题图标 -->
    <text x="32" y="52" font-size="32" filter="url(#epicGlow)">🛡️</text>
    <!-- 标题 -->
    <text x="80" y="34" font-family="'Noto Serif SC', serif" font-size="18" font-weight="900" fill="#fbbf24" letter-spacing="1">
      【战争】一片石狂飚 · 万骑冲阵
    </text>
    <!-- 意境散文白描 -->
    <text x="80" y="60" font-family="'Noto Serif SC', serif" font-size="12" fill="#cbd5e1" opacity="0.9" letter-spacing="0.5">
      一片石黄沙蔽日狂风骤起，两白旗万骑重铠铁骑自石河两翼惊雷般突入！数十万大军生死决战，天翻地覆！
    </text>
  </g>
</svg>