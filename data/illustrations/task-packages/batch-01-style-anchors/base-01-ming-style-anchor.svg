<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- 渐变与滤镜 -->
    <linearGradient id="bg-ming" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="45%" stop-color="#140b0d"/>
      <stop offset="75%" stop-color="#2a0d12"/>
      <stop offset="100%" stop-color="#06080d"/>
    </linearGradient>

    <!-- 卡拉瓦乔式剧烈金色斜射天光 -->
    <radialGradient id="god-ray-gold" cx="20%" cy="10%" r="85%" fx="15%" fy="5%">
      <stop offset="0%" stop-color="#ffdf79" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#d49b35" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#8a1f26" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- 肌肉高光漫反射 -->
    <radialGradient id="muscle-bronze" cx="48%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#f8c28d"/>
      <stop offset="35%" stop-color="#c8834a"/>
      <stop offset="75%" stop-color="#6e381b"/>
      <stop offset="100%" stop-color="#261007"/>
    </radialGradient>

    <radialGradient id="steel-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eaf7ff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#72b5d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1b3644" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow-drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="25" flood-color="#000" flood-opacity="0.85"/>
    </filter>
  </defs>

  <!-- 背景：紫禁城深宵与深红帷幔 -->
  <rect width="1920" height="1080" fill="url(#bg-ming)"/>
  <rect width="1920" height="1080" fill="url(#god-ray-gold)"/>

  <!-- 紫禁城飞檐与朱红巨柱剪影 (透视背景) -->
  <g opacity="0.35">
    <!-- 远景宫殿飞檐 -->
    <path d="M 0 350 L 320 320 L 580 340 L 480 430 L 0 490 Z" fill="#1b1217"/>
    <path d="M 1340 310 L 1720 280 L 1920 300 L 1920 450 L 1420 430 Z" fill="#1b1217"/>
    <!-- 巨型朱红廊柱 (卡拉瓦乔深影对照) -->
    <rect x="180" y="0" width="160" height="1080" fill="#240a0f"/>
    <rect x="1560" y="0" width="180" height="1080" fill="#1e090d"/>
    <!-- 撕裂翻卷的深红丝绒帷幔 (Baroque Drapery) -->
    <path d="M 220 0 Q 380 280 260 520 Q 140 760 310 1080 L 180 1080 L 180 0 Z" fill="#4d0e17" opacity="0.6"/>
    <path d="M 1720 0 Q 1520 340 1680 680 Q 1800 920 1620 1080 L 1740 1080 L 1740 0 Z" fill="#3f0a12" opacity="0.5"/>
  </g>

  <!-- 构图辅助网格与黄金分割线 (视觉导引) -->
  <g opacity="0.18" stroke="#e5b95c" stroke-width="1" stroke-dasharray="6 6">
    <!-- 黄金分割水平与垂直参考线 -->
    <line x1="733" y1="0" x2="733" y2="1080"/>
    <line x1="1187" y1="0" x2="1187" y2="1080"/>
    <line x1="0" y1="412" x2="1920" y2="412"/>
    <line x1="0" y1="668" x2="1920" y2="668"/>
    <!-- 对角动势视线 (斜斩动态) -->
    <line x1="280" y1="180" x2="1640" y2="900" stroke-width="1.5" stroke="#e5b95c" stroke-opacity="0.3"/>
  </g>

  <!-- 焦点人物：锦衣卫战意爆发 · 古铜雕塑肌体与破碎飞鱼服 (中心偏左动态构图) -->
  <g id="hero-ming" filter="url(#shadow-drop)">
    <!-- 飞鱼战袍飞扬下摆 -->
    <path d="M 720 680 Q 560 760 440 920 Q 580 960 780 910 Q 860 840 850 720 Z" fill="#881622" stroke="#e5b95c" stroke-width="2"/>
    <path d="M 980 720 Q 1160 810 1340 940 Q 1200 970 1020 900 Q 940 820 950 720 Z" fill="#5c0e16" stroke="#c99738" stroke-width="1.5"/>

    <!-- 紧实腰跨与战甲护腰 -->
    <path d="M 770 640 L 1050 640 L 1010 740 L 810 740 Z" fill="#181312" stroke="#d49b35" stroke-width="3"/>
    <circle cx="910" cy="690" r="28" fill="#e5b95c" stroke="#fff" stroke-width="1"/>

    <!-- 雕塑级八块腹肌与前锯肌轮廓 -->
    <path d="M 820 480 C 810 540 805 590 810 640 C 870 645 950 645 1010 640 C 1015 590 1010 540 1000 480 Z" fill="url(#muscle-bronze)"/>
    <!-- 腹中线与腹直肌凹凸光影 -->
    <path d="M 910 490 L 910 635" stroke="#3d1b0d" stroke-width="4" stroke-linecap="round"/>
    <!-- 6块腹肌阴影凹陷 -->
    <line x1="845" y1="525" x2="975" y2="525" stroke="#482010" stroke-width="3" opacity="0.8"/>
    <line x1="850" y1="565" x2="970" y2="565" stroke="#482010" stroke-width="3" opacity="0.8"/>
    <line x1="855" y1="605" x2="965" y2="605" stroke="#482010" stroke-width="3" opacity="0.8"/>
    <!-- 腹肌高光块 (卡拉瓦乔侧光高照) -->
    <ellipse cx="880" cy="510" rx="20" ry="12" fill="#ffdcb3" opacity="0.45"/>
    <ellipse cx="940" cy="510" rx="18" ry="12" fill="#ffdcb3" opacity="0.25"/>
    <ellipse cx="880" cy="545" rx="22" ry="13" fill="#ffdcb3" opacity="0.45"/>
    <ellipse cx="940" cy="545" rx="20" ry="13" fill="#ffdcb3" opacity="0.25"/>
    <ellipse cx="882" cy="585" rx="20" ry="12" fill="#ffdcb3" opacity="0.4"/>
    <ellipse cx="938" cy="585" rx="18" ry="12" fill="#ffdcb3" opacity="0.2"/>

    <!-- 饱满胸大肌与锁骨深窝 -->
    <path d="M 760 370 C 790 440 840 485 910 485 C 980 485 1030 440 1060 370 C 970 360 850 360 760 370 Z" fill="url(#muscle-bronze)"/>
    <ellipse cx="845" cy="425" rx="42" ry="26" fill="#ffe0be" opacity="0.42"/>
    <ellipse cx="975" cy="425" rx="40" ry="26" fill="#ffe0be" opacity="0.22"/>
    <path d="M 910 380 L 910 485" stroke="#36150a" stroke-width="4"/>

    <!-- 粗壮颈部与刚毅下颚轮廓 -->
    <path d="M 855 375 L 850 310 L 970 310 L 965 375 Z" fill="#b9733d"/>
    <path d="M 840 310 L 910 345 L 980 310 L 960 230 L 860 230 Z" fill="#c9824c"/>
    <!-- 飞鱼冠发髻与冷酷侧面阴影 -->
    <path d="M 850 240 Q 910 180 970 240 Z" fill="#161517" stroke="#e5b95c" stroke-width="2"/>
    <path d="M 895 180 L 925 180 L 920 150 L 900 150 Z" fill="#e5b95c"/>

    <!-- 右臂：撕裂战袍下的虬结二头肌与小臂横拉绣春刀 (强劲张力) -->
    <!-- 肩部三角肌 -->
    <circle cx="740" cy="390" r="50" fill="url(#muscle-bronze)"/>
    <!-- 肱二头肌暴突 -->
    <path d="M 720 410 L 610 480 Q 640 520 690 490 L 750 430 Z" fill="url(#muscle-bronze)"/>
    <ellipse cx="655" cy="460" rx="30" ry="18" fill="#ffe2c2" opacity="0.4" transform="rotate(-30 655 460)"/>
    <!-- 小臂紧绷与青筋纹理 -->
    <path d="M 610 480 L 510 510 L 525 565 L 635 525 Z" fill="#b26c36"/>
    <!-- 握刀之手 (骨节分明，力量爆发) -->
    <circle cx="505" cy="535" r="24" fill="#a45f2a"/>

    <!-- 绣春刀：逆光破晓，寒芒如霜 (长达800px的斜斩贯穿光刃) -->
    <g id="blade-glow">
      <!-- 刀光辉芒 -->
      <line x1="430" y1="580" x2="1280" y2="120" stroke="url(#steel-glow)" stroke-width="36" stroke-linecap="round"/>
      <!-- 刃身 -->
      <line x1="480" y1="550" x2="1220" y2="160" stroke="#f0faff" stroke-width="8" stroke-linecap="round"/>
      <line x1="490" y1="555" x2="1200" y2="170" stroke="#7ac0e2" stroke-width="3"/>
      <!-- 刀镡与朱红刀穗 -->
      <circle cx="510" cy="535" r="14" fill="#e5b95c"/>
      <path d="M 520 545 Q 560 620 520 700" stroke="#c0222a" stroke-width="6" fill="none"/>
    </g>

    <!-- 左臂：半垂微屈，手按刀鞘，披风飞卷 -->
    <path d="M 1070 380 Q 1160 450 1190 560 L 1140 580 Q 1110 480 1050 420 Z" fill="url(#muscle-bronze)"/>
    <ellipse cx="1120" cy="460" rx="36" ry="20" fill="#ffdcb3" opacity="0.25" transform="rotate(45 1120 460)"/>
  </g>

  <!-- 飘落的火星、飞雪与碎金微粒 (Baroque Atmospheric Dust) -->
  <g fill="#ffe082" opacity="0.75">
    <circle cx="480" cy="380" r="3"/>
    <circle cx="620" cy="310" r="2"/>
    <circle cx="890" cy="220" r="4"/>
    <circle cx="1140" cy="290" r="2.5"/>
    <circle cx="1320" cy="420" r="3.5"/>
    <circle cx="750" cy="610" r="2"/>
    <circle cx="1020" cy="560" r="3"/>
    <circle cx="580" cy="740" r="2.5"/>
    <circle cx="1450" cy="680" r="4"/>
  </g>

  <!-- 底部电影级文字标注卡与色板 (Task Package UI Banner) -->
  <g transform="translate(60, 930)">
    <!-- 半透明磨砂底衬 -->
    <rect width="1800" height="100" rx="12" fill="#0b0f17" fill-opacity="0.88" stroke="#e5b95c" stroke-width="1.5"/>
    
    <!-- 标牌印章 -->
    <rect x="25" y="22" width="130" height="56" rx="6" fill="#881622" stroke="#e5b95c" stroke-width="1"/>
    <text x="90" y="58" fill="#f8fafc" font-size="22" font-family="'Noto Serif SC', 'Songti SC', serif" font-weight="900" text-anchor="middle">大明中枢</text>

    <!-- 标题与核心意象 -->
    <text x="180" y="48" fill="#e5b95c" font-size="22" font-family="sans-serif" font-weight="bold">【风格锁定底图 01】紫禁夜寒 · 锦衣血战与大理石雕塑肌体</text>
    <text x="180" y="78" fill="#a0aec0" font-size="14" font-family="sans-serif">构图：卡拉瓦乔强侧光 (Chiaroscuro) · 逆光飞鱼刀光 · 撕裂战袍下健硕胸腹轮廓 · 朱红玄黑金线古典冷暖撞色</text>

    <!-- 调色盘采样方块 -->
    <g transform="translate(1420, 28)">
      <text x="-70" y="30" fill="#cbd5e0" font-size="13" font-family="sans-serif">主基调色板:</text>
      <rect x="10" y="8" width="45" height="34" rx="4" fill="#07090e" stroke="#fff" stroke-width="1" title="玄黑底色"/>
      <rect x="65" y="8" width="45" height="34" rx="4" fill="#881622" stroke="#fff" stroke-width="1" title="朱砂深红"/>
      <rect x="120" y="8" width="45" height="34" rx="4" fill="#e5b95c" stroke="#fff" stroke-width="1" title="鎏金侧光"/>
      <rect x="175" y="8" width="45" height="34" rx="4" fill="#c8834a" stroke="#fff" stroke-width="1" title="古铜肌肉"/>
      <rect x="230" y="8" width="45" height="34" rx="4" fill="#eaf7ff" stroke="#fff" stroke-width="1" title="冷钢寒刃"/>
    </g>
  </g>
</svg>
