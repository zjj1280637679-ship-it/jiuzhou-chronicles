name: Shared AI Browser Bridge Check
on:
  push:
    paths:
      - 'app.js'
      - 'index.html'
      - 'ai-gateway-config.js'
      - 'harness/**'
      - 'test-plugin-harness.cjs'
      - 'test/fixtures/harness-*.js'
      - 'test-shared-ai-connection.cjs'
      - 'test-ai-connection-probe.cjs'
      - 'test-free-exploration-edges.cjs'
      - '.github/workflows/shared-ai-bridge.yml'
  pull_request:
    paths:
      - 'app.js'
      - 'index.html'
      - 'ai-gateway-config.js'
      - 'harness/**'
      - 'test-plugin-harness.cjs'
      - 'test/fixtures/harness-*.js'
      - 'test-shared-ai-connection.cjs'
      - 'test-ai-connection-probe.cjs'
      - 'test-free-exploration-edges.cjs'
      - '.github/workflows/shared-ai-bridge.yml'
jobs:
  syntax-and-wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - run: node --check ai-gateway-config.js
      - name: Test shared AI failures, retry, and suture requests without network calls
        run: node --test test-shared-ai-connection.cjs test-ai-connection-probe.cjs test-free-exploration-edges.cjs test-plugin-harness.cjs
      - name: Check shared gateway wiring
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const app=fs.readFileSync('app.js','utf8');
          const html=fs.readFileSync('index.html','utf8');
          const cfg=fs.readFileSync('ai-gateway-config.js','utf8');
          assert.ok(html.includes('<script src="ai-gateway-config.js"></script>'));
          assert.ok(app.includes('/api/jiuzhou/turn'));
          assert.ok(app.includes('/health'));
          assert.ok(!app.includes('turnstile'));
          assert.ok(!app.includes('getSharedInviteCode'));
          assert.ok(!app.includes('body.inviteCode'));
          assert.ok(!cfg.includes('turnstileSiteKey'));
          assert.ok(app.includes('data.jiuzhouReady !== true'));
          assert.ok(!app.includes('fetch("/api/config", {'));
          assert.ok(!cfg.includes('sk-'));
          console.log('Direct shared gateway bridge present without visitor CAPTCHA');
          NODE
