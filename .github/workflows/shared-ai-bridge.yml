name: Personal AI and Game Logic Check
on:
  push:
    paths:
      - 'app.js'
      - 'index.html'
      - 'harness/**'
      - 'game-recovery.js'
      - 'scene-favorites.js'
      - 'input-viewport.js'
      - 'test-game-recovery.cjs'
      - 'test-scene-favorites.cjs'
      - 'test-input-viewport.cjs'
      - 'test-plugin-harness.cjs'
      - 'test-providers.cjs'
      - 'test-google-provider.cjs'
      - 'test-ai-provider-routing.cjs'
      - 'test-all-factions-tree.js'
      - 'test/fixtures/harness-*.js'
      - 'test-personal-api-migration.cjs'
      - 'test-ai-connection-probe.cjs'
      - 'test-free-exploration-edges.cjs'
      - '.github/workflows/shared-ai-bridge.yml'
  pull_request:
    paths:
      - 'app.js'
      - 'index.html'
      - 'harness/**'
      - 'game-recovery.js'
      - 'scene-favorites.js'
      - 'input-viewport.js'
      - 'test-game-recovery.cjs'
      - 'test-scene-favorites.cjs'
      - 'test-input-viewport.cjs'
      - 'test-plugin-harness.cjs'
      - 'test-providers.cjs'
      - 'test-google-provider.cjs'
      - 'test-ai-provider-routing.cjs'
      - 'test-all-factions-tree.js'
      - 'test/fixtures/harness-*.js'
      - 'test-personal-api-migration.cjs'
      - 'test-ai-connection-probe.cjs'
      - 'test-free-exploration-edges.cjs'
      - '.github/workflows/shared-ai-bridge.yml'
jobs:
  syntax-and-wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - name: Test personal API, migration and game recovery without network calls
        run: node --unhandled-rejections=strict --test test-personal-api-migration.cjs test-ai-connection-probe.cjs test-free-exploration-edges.cjs test-plugin-harness.cjs test-providers.cjs test-google-provider.cjs test-ai-provider-routing.cjs test-game-recovery.cjs test-scene-favorites.cjs test-input-viewport.cjs
      - name: Check four-faction offline regression with the same provider module as the webpage
        run: npm test
