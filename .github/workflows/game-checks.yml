name: Personal AI and Game Logic Check
on:
  push:
    paths:
      - '*.js'
      - '*.cjs'
      - '*.mjs'
      - '*.html'
      - 'harness/**'
      - 'data/**'
      - 'test/fixtures/**'
      - 'scripts/build-static.cjs'
      - 'package.json'
      - 'vercel.json'
      - '.vercelignore'
      - '.github/workflows/game-checks.yml'
  pull_request:
    paths:
      - '*.js'
      - '*.cjs'
      - '*.mjs'
      - '*.html'
      - 'harness/**'
      - 'data/**'
      - 'test/fixtures/**'
      - 'scripts/build-static.cjs'
      - 'package.json'
      - 'vercel.json'
      - '.vercelignore'
      - '.github/workflows/game-checks.yml'
permissions:
  contents: read
jobs:
  syntax-and-wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - name: Test personal APIs, plugins, recovery, effects and static serving without model calls
        run: npm run test:unit
      - name: Check four-faction offline game behavior
        run: npm test
      - name: Check story-data fields and Qing tree structure
        run: npm run test:content
      - name: Assemble public static assets
        run: npm run build

  first-act-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y fonts-noto-cjk
      - name: Real browser pagination, media and failure tests
        run: |
          export JIUZHOU_BROWSER_EXECUTABLE="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')"
          node test-first-act-pages-browser.mjs
          node test-scene-media-browser.mjs
          node test-scene-media-status-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-act-pages-browser-evidence
          path: |
            /tmp/jiuzhou-first-act-pages-qa
            /tmp/jiuzhou-media-network
          if-no-files-found: warn
