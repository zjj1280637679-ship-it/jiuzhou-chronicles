name: Jiuzhou Simulated Browser AI Bridge
on:
  push:
    paths:
      - 'test-shared-ai-browser.mjs'
      - 'test-mobile-layout.mjs'
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'mobile.css'
      - 'mobile-ui.js'
      - '*-ui.js'
      - '*-ui.css'
      - 'settings.css'
      - 'favorites.css'
      - 'scene-favorites.js'
      - 'game-recovery.js'
      - 'input-viewport.*'
      - 'test-input-viewport-browser.mjs'
      - 'test-exploration-ui.mjs'
      - 'assets/**'
      - 'data/illustrations/**'
      - 'data/mobile/**'
      - 'ai-gateway-config.js'
      - 'harness/**'
      - '.github/workflows/jiuzhou-live-ai-browser.yml'
  pull_request:
    paths:
      - 'test-shared-ai-browser.mjs'
      - 'test-mobile-layout.mjs'
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'mobile.css'
      - 'mobile-ui.js'
      - '*-ui.js'
      - '*-ui.css'
      - 'settings.css'
      - 'favorites.css'
      - 'scene-favorites.js'
      - 'game-recovery.js'
      - 'input-viewport.*'
      - 'test-input-viewport-browser.mjs'
      - 'test-exploration-ui.mjs'
      - 'assets/**'
      - 'data/illustrations/**'
      - 'data/mobile/**'
      - 'ai-gateway-config.js'
      - 'harness/**'
      - '.github/workflows/jiuzhou-live-ai-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Test this checkout locally with simulated Worker and no CAPTCHA
        run: node test-shared-ai-browser.mjs
      - name: Test mobile and desktop layout through real UI without model calls
        run: node test-mobile-layout.mjs
      - name: Test visual keyboard viewport fitting without device or model traffic
        run: node test-input-viewport-browser.mjs
      - name: Test settings, favorites and failed action recovery through the UI
        run: node test-exploration-ui.mjs
