name: Jiuzhou Personal API Browser Checks
on:
  push:
    paths:
      - 'test-personal-ai-browser.mjs'
      - 'test-mobile-layout.mjs'
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'mobile.css'
      - 'mobile-ui.js'
      - '*-ui.js'
      - '*-ui.css'
      - 'settings.css'
      - 'favorites.css'
      - 'scene-favorites.js'
      - 'game-recovery.js'
      - 'input-viewport.*'
      - 'test-input-viewport-browser.mjs'
      - 'test-exploration-ui.mjs'
      - 'assets/**'
      - 'data/illustrations/**'
      - 'illustration-system.js'
      - 'test-illustration-*'
      - 'test-illustrations-browser.mjs'
      - 'test-background-tools-browser.mjs'
      - 'test-gallery-browser.mjs'
      - 'data/mobile/**'
      - 'harness/**'
      - '.github/workflows/jiuzhou-live-ai-browser.yml'
  pull_request:
    paths:
      - 'test-personal-ai-browser.mjs'
      - 'test-mobile-layout.mjs'
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'mobile.css'
      - 'mobile-ui.js'
      - '*-ui.js'
      - '*-ui.css'
      - 'settings.css'
      - 'favorites.css'
      - 'scene-favorites.js'
      - 'game-recovery.js'
      - 'input-viewport.*'
      - 'test-input-viewport-browser.mjs'
      - 'test-exploration-ui.mjs'
      - 'assets/**'
      - 'data/illustrations/**'
      - 'illustration-system.js'
      - 'test-illustration-*'
      - 'test-illustrations-browser.mjs'
      - 'test-background-tools-browser.mjs'
      - 'test-gallery-browser.mjs'
      - 'data/mobile/**'
      - 'harness/**'
      - '.github/workflows/jiuzhou-live-ai-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    # Pin the runner and use its installed Chrome for the browser tests.
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      JIUZHOU_BROWSER_EXECUTABLE: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.62.1
      - run: "$JIUZHOU_BROWSER_EXECUTABLE" --version
      - name: Test personal API migration and native tools with simulated model responses
        run: node test-personal-ai-browser.mjs
      - name: Test registered illustrations and isolated native tools
        run: node --test test-illustration-registry.cjs test-illustration-harness.cjs test-plugin-harness.cjs
      - name: Test scene art and multi-image story delivery through the browser
        run: node test-illustrations-browser.mjs
      - name: Test 108-image gallery search and on-demand image requests
        run: node test-gallery-browser.mjs
      - name: Test independent stage backgrounds and interactive image popups
        run: node test-background-tools-browser.mjs
      - name: Test mobile and desktop layout through real UI without model calls
        run: node test-mobile-layout.mjs
      - name: Test visual keyboard viewport fitting without device or model traffic
        run: node test-input-viewport-browser.mjs
      - name: Test settings, favorites and failed action recovery through the UI
        run: node test-exploration-ui.mjs
